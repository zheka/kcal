  <circle cx="283" cy="282" r="13" fill="#221710"/>
  <circle cx="233" cy="277" r="4.5" fill="#ffffff"/>
  <circle cx="287" cy="277" r="4.5" fill="#ffffff"/>
  <g stroke="#3a2416" stroke-width="6" stroke-linecap="round" fill="none">
