    <path d="M279.6,182.8 Q277.4,131.7 306.6,87.8 Q385.6,98.7 407.2,177.6 Q377.5,213.2 334.8,219.9 Q300.1,209.2 279.6,182.8 Z" fill="url(#lobe)"/><ellipse cx="352.3" cy="141.7" rx="24.7" ry="8.9" transform="rotate(397.8 352.3 141.7)" fill="#fff3d0" opacity="0.55" stroke="none"/>
    <path d="M159.2,278.7 Q133.5,297.2 99.4,286.5 Q69.3,217.9 113.3,161 Q158,174.1 183.2,212.4 Q177.8,245.9 159.2,278.7 Z" fill="url(#lobe)"/><ellipse cx="111.6" cy="228.8" rx="19.8" ry="7.1" transform="rotate(284.4 111.6 228.8)" fill="#fff3d0" opacity="0.55" stroke="none"/>
    <path d="M328.8,212.4 Q354,174.1 398.7,161 Q442.7,217.9 412.6,286.5 Q378.5,297.2 352.8,278.7 Q334.2,245.9 328.8,212.4 Z" fill="url(#lobe)"/><ellipse cx="400.4" cy="228.8" rx="19.8" ry="7.1" transform="rotate(435.6 400.4 228.8)" fill="#fff3d0" opacity="0.55" stroke="none"/>
