    <path d="M352.6,268.4 Q385.4,253.8 417,270 Q407.2,331.2 351.5,362.3 Q328,358.4 328.1,338.8 Q340,302.2 352.6,268.4 Z" fill="url(#lobe)"/><ellipse cx="381.1" cy="319.9" rx="13" ry="4.7" transform="rotate(473.3 381.1 319.9)" fill="#fff3d0" opacity="0.55" stroke="none"/>
    <path d="M238.5,365.5 Q250.1,371.3 236,379.3 Q188,381.9 148,354.1 Q152.6,331.6 177,330.4 Q206,351.2 238.5,365.5 Z" fill="url(#lobe)"/><ellipse cx="195" cy="370" rx="6.3" ry="2.3" transform="rotate(210.4 195 370)" fill="#fff3d0" opacity="0.55" stroke="none"/>
