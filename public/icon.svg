<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- kcal: a hedgehog hugged by a croissant. Generated by scripts/make-icon.py; content stays inside
       the maskable safe zone (a circle of radius 205 around the centre). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b9162"/>
      <stop offset="1" stop-color="#1c6e45"/>
    </linearGradient>
    <radialGradient id="lobe" cx="0.5" cy="0.45" r="0.62">
